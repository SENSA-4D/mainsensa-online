            .page-header {

            .marquee {
                background: #000;
                padding: 8px 0;
                width: 100%;
                font-size: 14px;
                border-bottom: 1px solid #fff;
                white-space: nowrap;
                overflow: hidden;
            }
            .marquee span {
                display: inline-block;
                animation: marquee 20s linear infinite;
                padding-left: 100%;
            }
            @keyframes marquee {

                }

                }
            }

            .buttonWrap {
                display: flex;
                justify-content: center;
                align-items: center;

                text-align: center;
                border-radius: 10px;
                font-weight: 700;
                margin: 8px auto;
                text-decoration: none;

            }
            .button-blue {
                background: linear-gradient(to bottom, #ff7417, #e83c02, #c93402);

            }
            .button-orange {

                color: #ffffff;
                width: 100px;
                font-size: 20px;
                padding: 12px;
                border-radius: 10px;
                margin: 0;
            }

            .center-bank {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 1px;
                padding: 5px;
                width: 100%;
                box-sizing: border-box;
            }
            .bank {
                background: #fff;
                padding: 1px;
                border-radius: 10px;
                border: groove 2px gold;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 30px;
            }
            .bank img {
                max-width: 50px;
                max-height: 35px;
                height: auto;
                margin: 0 5px;
            }

            table {
                width: 90%;
                margin: 15px auto;
                border-collapse: separate;
                border: 2px solid gold;
                border-radius: 2px;
                background: #161616;
            }
            table th {
                background: linear-gradient(to bottom, var(--primary), var(--secondary));
                color: #000;
                padding: 10px;
            }
            table td {
                border: 2px solid #8a8a8a;
                padding: 6px;
                font-size: 14px;
                text-align: center;
            }
            table td a {
                color: #fff;
                text-decoration: none;
                transition: color 0.2s ease;
            }

            table td a:hover {

            }

            .footer {
                padding: 20px;

                font-size: 11px;
                color: #aaa;
                width: 100%;
                box-sizing: border-box;
            }

            .footer a:hover {

            /* ========== TV RUSAK OVERLAY ========== */
            .row {
                position: relative;
            }
            .tv-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 9999;
                pointer-events: none;
                overflow: hidden;
                opacity: 1;
                animation: tv-flash-overlay 7s ease-out 1 forwards;
            }
            @keyframes tv-flash-overlay {
                0%    { opacity: 1; }
                8%    { opacity: 0.5; }
                12%   { opacity: 1; }
                20%   { opacity: 0.7; }
                25%   { opacity: 1; }
                35%   { opacity: 0.6; }
                42%   { opacity: 1; }
                52%   { opacity: 0.8; }
                58%   { opacity: 1; }
                65%   { opacity: 0.4; }
                72%   { opacity: 1; }
                80%   { opacity: 0.5; }
                88%   { opacity: 0.2; }
                94%   { opacity: 0.6; }
                100%  { opacity: 0; }
            }

            /* Scanlines horizontal */
            .tv-scanlines {
                position: absolute;
                top: 0; left: 0; right: 0; bottom: 0;
                background: repeating-linear-gradient(
                    to bottom,
                    transparent 0px,
                    transparent 2px,
                    rgba(0, 0, 0, 0.18) 2px,
                    rgba(0, 0, 0, 0.18) 4px
                );
                z-index: 1;
            }

            /* Flicker layer */
            .tv-flicker {
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(255, 255, 255, 0.015);
                animation: tv-flicker-anim 0.12s steps(1) infinite;
                z-index: 2;
            }
            @keyframes tv-flicker-anim {
                0%   { opacity: 1; }
                15%  { opacity: 0.75; }
                30%  { opacity: 1; }
                50%  { opacity: 0.88; }
                65%  { opacity: 1; }
                80%  { opacity: 0.92; }
                100% { opacity: 1; }
            }

            /* Garis putih bergerak ke bawah */
            .tv-glitch-bar {
                position: absolute;
                left: 0;
                width: 100%;
                height: 2px;
                background: linear-gradient(to right, transparent, rgba(255,255,255,0.85), transparent);
                animation: tv-bar-down 5s linear infinite;
                z-index: 3;
            }
            @keyframes tv-bar-down {
                0%   { top: -2px; opacity: 0; }
                5%   { opacity: 0.7; }
                90%  { opacity: 0.4; }
                100% { top: 102%; opacity: 0; }
            }

            /* Glitch color band merah */
            .tv-band-r {
                position: absolute;
                left: 0;
                width: 100%;
                height: 0;
                background: rgba(255, 0, 60, 0.07);
                animation: tv-band-r-anim 6s steps(1) infinite;
                z-index: 4;
            }
            @keyframes tv-band-r-anim {
                0%    { top: 20%; height: 0; opacity: 0; }
                8%    { top: 18%; height: 25px; opacity: 1; }
                10%   { top: 55%; height: 8px; opacity: 0.6; }
                12%   { top: 80%; height: 0; opacity: 0; }
                60%   { top: 40%; height: 18px; opacity: 0.9; }
                62%   { top: 40%; height: 0; opacity: 0; }
                100%  { top: 20%; height: 0; opacity: 0; }
            }

            /* Glitch color band cyan */
            .tv-band-c {
                position: absolute;
                left: 0;
                width: 100%;
                height: 0;
                background: rgba(0, 255, 220, 0.06);
                animation: tv-band-c-anim 8s steps(1) infinite;
                z-index: 4;
            }
            @keyframes tv-band-c-anim {
                0%    { top: 70%; height: 0; opacity: 0; }
                20%   { top: 65%; height: 12px; opacity: 0.8; }
                22%   { top: 30%; height: 30px; opacity: 0.5; }
                25%   { top: 30%; height: 0; opacity: 0; }
                75%   { top: 85%; height: 10px; opacity: 1; }
                77%   { top: 85%; height: 0; opacity: 0; }
                100%  { top: 70%; height: 0; opacity: 0; }
            }

            /* Horizontal distortion */
            .tv-distort {
                position: absolute;
                left: 0;
                width: 100%;
                height: 0;
                background: rgba(255,255,255,0.1);
                animation: tv-distort-anim 9s steps(1) infinite;
                z-index: 5;
            }
            @keyframes tv-distort-anim {
                0%   { top: 50%; height: 0; transform: translateX(0); opacity: 0; }
                33%  { top: 33%; height: 4px; transform: translateX(-8px); opacity: 1; }
                34%  { top: 33%; height: 4px; transform: translateX(6px); opacity: 0.7; }
                35%  { top: 33%; height: 0; opacity: 0; }
                66%  { top: 66%; height: 6px; transform: translateX(10px); opacity: 1; }
                67%  { top: 66%; height: 0; opacity: 0; }
                100% { top: 50%; height: 0; opacity: 0; }
            }

            .tv-text-wrap {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 10;
                text-align: center;
                width: 90%;
            }
            .tv-text {
                display: inline-block;
                font-family: 'Courier New', Courier, monospace;
                font-size: clamp(16px, 5vw, 34px);
                font-weight: 900;
                color: #ffffff;
                letter-spacing: 3px;
                text-transform: uppercase;
                text-shadow:
                    3px 0 #ff003c,
                    -3px 0 #00ffcc;
                animation: tv-glitch-text 4s infinite;
                white-space: nowrap;
                padding: 14px 28px;
                background: rgba(0, 0, 0, 0.78);
                border: 1px solid rgba(255, 255, 255, 0.25);
                box-shadow: 0 0 20px rgba(255,0,60,0.3), inset 0 0 30px rgba(0,0,0,0.5);
            }
            @keyframes tv-glitch-text {
                0%, 80%, 100% {
                    text-shadow: 3px 0 #ff003c, -3px 0 #00ffcc;
                    transform: none;
                }
                81% {
                    text-shadow: -5px 0 #ff003c, 5px 0 #00ffcc;
                    transform: skewX(6deg) translateX(4px);
                }
                82% {
                    text-shadow: 5px 0 #ff003c, -5px 0 #00ffcc;
                    transform: skewX(-3deg) translateX(-3px);
                }
                83% {
                    text-shadow: -2px 0 #ff003c, 2px 0 #00ffcc;
                    transform: none;
                }
                84% {
                    text-shadow: 6px 0 #ff003c, -6px 0 #00ffcc;
                    transform: skewX(2deg) translateX(2px);
                }
                85% {
                    text-shadow: 3px 0 #ff003c, -3px 0 #00ffcc;
                    transform: none;
                }
            }

            /* Sub teks SIGNAL LOST berkedip */
            .tv-text-sub {
                display: block;
                font-family: 'Courier New', Courier, monospace;
                font-size: clamp(9px, 2.5vw, 13px);
                color: #ffb01c;
                letter-spacing: 7px;
                margin-top: 8px;
                animation: tv-blink 1s steps(1) infinite;
            }
            @keyframes tv-blink {
                0%, 49% { opacity: 1; }
                50%, 100% { opacity: 0; }
            }

        </style>
